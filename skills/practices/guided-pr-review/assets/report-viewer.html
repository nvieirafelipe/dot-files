<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR review</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #59636e;
    --border: #d1d9e0;
    --surface: #f6f8fa;
    --hover: rgba(208, 215, 222, 0.32);
    --accent: #0969da;
    --accent-subtle: #ddf4ff;
    --scrim: rgba(31, 35, 40, 0.5);
    --critical: #cf222e;
    --required: #bc4c00;
    --question: #8250df;
    --consider: #1a7f37;
    --nit: #59636e;
    --fyi: #0969da;
    --bar-h: 0px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --border: #3d444d;
      --surface: #151b23;
      --hover: rgba(101, 108, 118, 0.2);
      --accent: #4493f8;
      --accent-subtle: rgba(56, 139, 253, 0.15);
      --scrim: rgba(1, 4, 9, 0.7);
      --critical: #f85149;
      --required: #db6d28;
      --question: #ab7df8;
      --consider: #3fb950;
      --nit: #9198a1;
      --fyi: #4493f8;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .icon {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); }

  /* Contents: a sticky column on wide screens, a drawer on narrow ones. */
  .bar { display: none; }
  .scrim { display: none; }
  nav {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 16px 12px 48px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    font-size: 13px;
  }
  nav:focus { outline: none; }
  .nav-head { display: flex; align-items: flex-start; gap: 8px; padding: 0 4px; }
  .doc-title {
    flex: 1;
    min-width: 0;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
    color: var(--fg);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    text-decoration: none;
  }
  .doc-title:hover { color: var(--accent); }
  .tools { display: flex; gap: 6px; margin: 12px 4px 10px; }
  .btn {
    font: inherit;
    font-size: 12px;
    line-height: 1.5;
    padding: 3px 10px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }
  .btn:hover { background: var(--hover); }
  .icon-btn {
    flex: none;
    display: none;
    place-items: center;
    width: 36px;
    height: 36px;
    margin: -6px -4px 0 0;
    padding: 0;
    color: var(--muted);
    background: none;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--hover); color: var(--fg); }

  .toc, .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc ul { margin-left: 11px; padding-left: 6px; border-left: 1px solid var(--border); }
  .row { display: flex; align-items: flex-start; }
  .twisty, .spacer { flex: none; width: 22px; height: 26px; }
  .twisty {
    display: grid;
    place-items: center;
    padding: 0;
    color: var(--muted);
    background: none;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }
  .twisty:hover { background: var(--hover); color: var(--fg); }
  .twisty svg { transition: transform 0.15s ease; }
  .twisty[aria-expanded="false"] svg { transform: rotate(-90deg); }
  .row a {
    flex: 1;
    min-width: 0;
    padding: 3px 6px;
    border-radius: 6px;
    color: var(--fg);
    text-decoration: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .toc li li > .row a { color: var(--muted); }
  .row a:hover { background: var(--hover); color: var(--fg); }
  .row a.current, .row a.within {
    background: var(--accent-subtle);
    color: var(--accent);
    font-weight: 600;
  }
  .row a code { font: 0.92em var(--mono); background: none; padding: 0; }
  .row a .badge { font-size: 0.85em; padding: 0 5px; }
  .count {
    display: none;
    flex: none;
    min-width: 20px;
    margin: 4px 2px 0 4px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--hover);
    color: var(--muted);
    font-size: 11px;
    line-height: 18px;
    text-align: center;
  }
  li.closed > .row .count { display: inline-block; }

  /* The report. */
  main { max-width: 940px; padding: 24px 40px 96px; overflow-wrap: break-word; }
  h1, h2, h3, h4 { line-height: 1.3; scroll-margin-top: calc(var(--bar-h) + 16px); }
  h1 { font-size: 1.9em; margin-top: 0.4em; }
  h2 { margin-top: 2em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
  h4 { font-size: 1em; }
  a { color: var(--accent); }
  code {
    font: 0.88em/1.5 var(--mono);
    background: var(--surface);
    padding: 0.1em 0.35em;
    border-radius: 4px;
    overflow-wrap: anywhere;
  }
  td code, th code { white-space: nowrap; }
  td code.path, th code.path { white-space: normal; }
  pre {
    position: relative;
    overflow-x: auto;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  pre code { padding: 0; background: none; overflow-wrap: normal; }
  kbd {
    font: 0.85em var(--mono);
    padding: 0.1em 0.4em;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    background: var(--surface);
  }
  table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
  th, td { padding: 6px 10px; border: 1px solid var(--border); vertical-align: top; }
  th { background: var(--surface); text-align: left; }
  blockquote { margin: 0; padding: 0 1em; color: var(--muted); border-left: 3px solid var(--border); }
  details { margin: 1em 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; }
  summary { cursor: pointer; font-weight: 600; }
  li:has(input[type="checkbox"]) { list-style: none; margin-left: -1.2em; }
  input[type="checkbox"] { margin-right: 6px; transform: translateY(1px); }
  pre .copy {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 12px;
    padding: 2px 8px;
    opacity: 0.7;
  }
  pre:hover .copy, pre .copy:focus-visible { opacity: 1; }
  .mermaid { margin: 1em 0; padding: 12px; border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; }
  .mermaid svg { display: block; margin: 0 auto; }
  .badge {
    display: inline-block;
    padding: 0 6px;
    border: 1px solid currentColor;
    border-radius: 999px;
    font-size: 0.8em;
    font-weight: 600;
    line-height: 1.5;
  }
  .badge-critical { color: var(--critical); }
  .badge-required { color: var(--required); }
  .badge-question { color: var(--question); }
  .badge-consider { color: var(--consider); }
  .badge-nit { color: var(--nit); }
  .badge-fyi { color: var(--fyi); }

  @media (hover: none) {
    pre .copy { opacity: 1; padding: 6px 12px; }
  }

  @media (max-width: 860px) {
    :root { --bar-h: 48px; }
    body { font-size: 16px; }
    .layout { display: block; }
    .bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      height: var(--bar-h);
      padding: 0 6px;
      background: var(--bg);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    #menu {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: 0 10px;
      color: var(--fg);
      background: none;
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }
    #menu svg { flex: none; color: var(--muted); }
    #menu .label { flex: none; font-weight: 600; }
    #menu .here { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    #menu .here:not(:empty)::before { content: "· "; }
    nav {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 40;
      width: min(88vw, 22rem);
      height: auto;
      padding: 14px 10px max(48px, env(safe-area-inset-bottom));
      border-right: 1px solid var(--border);
      font-size: 15px;
      transform: translateX(-100%);
      visibility: hidden;
      transition: transform 0.25s ease, visibility 0s linear 0.25s;
    }
    .toc-open nav {
      transform: none;
      visibility: visible;
      box-shadow: 0 0 32px rgba(1, 4, 9, 0.3);
      transition: transform 0.3s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .toc-open .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: var(--scrim); }
    .toc-open, .toc-open body { overflow: hidden; }
    .icon-btn { display: grid; }
    .tools .btn { padding: 8px 14px; font-size: 13px; }
    .twisty, .spacer { width: 36px; height: 44px; }
    .toc ul { margin-left: 17px; }
    .row a {
      padding: 11px 8px;
      line-height: 1.4;
      white-space: normal;
    }
    .count { margin-top: 13px; }
    main { padding: 16px 16px 96px; }
    h1 { font-size: 1.6em; }
    th, td { min-width: 7rem; }
    input[type="checkbox"] { width: 20px; height: 20px; vertical-align: -4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    nav, .toc-open nav, .twisty svg { transition: none; }
  }
  .raw .bar, .raw nav { display: none; }
  .raw .layout { display: block; }
  @media print {
    .bar, nav, .scrim, .copy { display: none !important; }
    .layout { display: block; }
  }
</style>
</head>
<body id="top">
<header class="bar">
  <button type="button" id="menu" aria-controls="sidebar" aria-expanded="false">
    <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M2 4h12M2 8h12M2 12h12"/>
    </svg>
    <span class="label">Contents</span><span class="here" id="here"></span>
  </button>
</header>
<div class="layout">
  <nav id="sidebar" aria-label="Contents" tabindex="-1">
    <div class="nav-head">
      <a class="doc-title" id="doc-title" href="#top">PR review</a>
      <button type="button" class="icon-btn" id="close" aria-label="Close contents">
        <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 4l8 8M12 4l-8 8"/>
        </svg>
      </button>
    </div>
    <div class="tools">
      <button type="button" class="btn" id="expand">Expand all</button>
      <button type="button" class="btn" id="collapse">Collapse all</button>
    </div>
    <ul class="toc" id="toc"></ul>
  </nav>
  <div class="scrim" id="scrim"></div>
  <main id="content"><p>Loading the report...</p></main>
</div>
<script id="report-source" type="text/plain">@@REPORT_BASE64@@</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"
        integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"
        integrity="sha384-rbtjAdnIQE/aQJGEgXrVUlMibdfTSa4PQju4HDhN3sR2PmaKFzhEafuePsl9H/9I"
        crossorigin="anonymous"></script>
<script>
(function () {
  "use strict";

  var LABELS = /(^|·\s*)(Critical|Required|Question|Consider|Nit|FYI)(?=\s*·|\s*$)/;
  var PATH = /^[\w.@~-]+(?:\/[\w.@~-]+)+(?::[\d,-]+)?$/;
  var CHEVRON = '<svg class="icon" width="12" height="12" viewBox="0 0 16 16" aria-hidden="true">' +
    '<path d="M4 6l4 4 4-4"/></svg>';

  var root = document.documentElement;
  var content = document.getElementById("content");
  var bytes = Uint8Array.from(atob(document.getElementById("report-source").textContent.trim()),
    function (c) { return c.charCodeAt(0); });
  var markdown = new TextDecoder().decode(bytes);

  if (!window.marked || !window.DOMPurify) {
    var raw = document.createElement("pre");
    raw.textContent = markdown;
    content.replaceChildren(raw);
    root.classList.add("raw");
    return;
  }

  var SAFE_HTML = /<!--[\s\S]*?-->|<\/?(details|summary|br|kbd|sub|sup)\b[^>]*>/gi;
  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  marked.use({
    renderer: {
      html: function (html) {
        var text = typeof html === "string" ? html : html.text;
        return /</.test(text.replace(SAFE_HTML, "")) ? escapeHtml(text) : text;
      }
    }
  });

  content.innerHTML = DOMPurify.sanitize(marked.parse(markdown, { gfm: true }));

  var h1 = content.querySelector("h1");
  if (h1) {
    document.title = h1.textContent;
    document.getElementById("doc-title").textContent = h1.textContent;
  }

  function slug(text) {
    return text.trim().toLowerCase().replace(/[^\p{L}\p{M}\p{N}\s_-]/gu, "").replace(/\s/g, "-");
  }

  function badge(root) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (node) {
      var match = LABELS.exec(node.nodeValue);
      if (!match) return;
      var start = match.index + match[1].length;
      var rest = node.splitText(start);
      rest.splitText(match[2].length);
      var span = document.createElement("span");
      span.className = "badge badge-" + match[2].toLowerCase();
      span.textContent = match[2];
      rest.replaceWith(span);
    });
  }

  // A heading as the contents show it: file paths cut to the file name, so the line
  // numbers survive when the entry is cut short. The full text stays in the title.
  function tocLabel(h) {
    var frag = document.createDocumentFragment();
    h.childNodes.forEach(function (node) {
      if (node.nodeName === "CODE") {
        var text = node.textContent;
        var code = document.createElement("code");
        code.textContent = PATH.test(text) ? text.slice(text.lastIndexOf("/") + 1) : text;
        frag.appendChild(code);
      } else {
        frag.appendChild(document.createTextNode(node.textContent));
      }
    });
    return frag;
  }

  // The contents tree. Each heading with headings under it gets a disclosure button.
  // A group longer than LONG_GROUP entries, such as the comment drafts, starts
  // collapsed and shows its count; findings stay in view.
  var LONG_GROUP = 6;
  var toc = document.getElementById("toc");
  var headings = Array.prototype.slice.call(content.querySelectorAll("h2, h3, h4"));
  var entries = [];
  var groups = [];
  var byId = {};
  var seen = {};
  var stack = [{ level: 1, entry: null, list: toc }];
  headings.forEach(function (h) {
    var base = slug(h.textContent) || "section";
    var id = base in seen ? base + "-" + (++seen[base]) : base;
    if (!(base in seen)) seen[base] = 0;
    h.id = id;

    var level = Number(h.tagName.charAt(1));
    while (stack[stack.length - 1].level >= level) stack.pop();
    var frame = stack[stack.length - 1];
    if (!frame.list) frame.list = group(frame.entry);

    var link = document.createElement("a");
    link.href = "#" + id;
    link.title = h.textContent;
    link.appendChild(tocLabel(h));
    if (level === 4) badge(link);
    var spacer = document.createElement("span");
    spacer.className = "spacer";
    var row = document.createElement("div");
    row.className = "row";
    row.append(spacer, link);
    var item = document.createElement("li");
    item.appendChild(row);
    frame.list.appendChild(item);

    var entry = { h: h, item: item, row: row, link: link, parent: frame.entry, button: null, list: null };
    entries.push(entry);
    byId[id] = entry;
    stack.push({ level: level, entry: entry, list: null });
  });

  function group(entry) {
    var list = document.createElement("ul");
    list.id = "toc-group-" + groups.length;
    var button = document.createElement("button");
    button.type = "button";
    button.className = "twisty";
    button.setAttribute("aria-controls", list.id);
    button.setAttribute("aria-label", "Sections in " + entry.h.textContent);
    button.innerHTML = CHEVRON;
    entry.row.replaceChild(button, entry.row.firstChild);
    var count = document.createElement("span");
    count.className = "count";
    count.setAttribute("aria-hidden", "true");
    entry.row.appendChild(count);
    entry.item.appendChild(list);
    entry.button = button;
    entry.list = list;
    entry.count = count;
    groups.push(entry);
    return list;
  }

  function setOpen(entry, open) {
    entry.button.setAttribute("aria-expanded", String(open));
    entry.list.hidden = !open;
    entry.item.classList.toggle("closed", !open);
  }
  groups.forEach(function (entry) {
    var size = entry.list.children.length;
    entry.count.textContent = size;
    setOpen(entry, size <= LONG_GROUP);
  });

  function expandTo(entry) {
    for (var up = entry.parent; up; up = up.parent) setOpen(up, true);
  }

  toc.addEventListener("click", function (event) {
    var button = event.target.closest(".twisty");
    if (button) {
      var entry = groups.filter(function (g) { return g.button === button; })[0];
      setOpen(entry, button.getAttribute("aria-expanded") !== "true");
      mark(true);
      return;
    }
    if (event.target.closest("a") && root.classList.contains("toc-open")) drawer(false, false);
  });
  toc.addEventListener("keydown", function (event) {
    var button = event.target.closest(".twisty");
    if (!button || (event.key !== "ArrowRight" && event.key !== "ArrowLeft")) return;
    var entry = groups.filter(function (g) { return g.button === button; })[0];
    setOpen(entry, event.key === "ArrowRight");
    mark(true);
    event.preventDefault();
  });
  document.getElementById("expand").addEventListener("click", function () {
    groups.forEach(function (g) { setOpen(g, true); });
    mark(true);
  });
  document.getElementById("collapse").addEventListener("click", function () {
    groups.forEach(function (g) { setOpen(g, false); });
    mark(true);
  });

  content.querySelectorAll("h4, li").forEach(function (el) {
    if (el.tagName === "H4" || el.querySelector("input[type=checkbox]")) badge(el);
  });

  // Paths break after a slash rather than mid-name; a table keeps other code on one line.
  content.querySelectorAll(":not(pre) > code").forEach(function (code) {
    var text = code.textContent;
    if (text.indexOf("/") < 0) return;
    code.classList.add("path");
    if (code.children.length) return;
    code.replaceChildren();
    text.split("/").forEach(function (part, i, parts) {
      code.appendChild(document.createTextNode(i < parts.length - 1 ? part + "/" : part));
      if (i < parts.length - 1 && part) code.appendChild(document.createElement("wbr"));
    });
  });

  function sectionOf(node) {
    var found = null;
    headings.forEach(function (h) {
      if (h.compareDocumentPosition(node) & Node.DOCUMENT_POSITION_FOLLOWING) found = h;
    });
    return found ? found.id : "top";
  }
  var storagePrefix = "guided-pr-review:" + location.pathname + ":";
  var perSection = {};
  content.querySelectorAll("input[type=checkbox]").forEach(function (box) {
    var section = sectionOf(box);
    perSection[section] = (perSection[section] || 0) + 1;
    var key = storagePrefix + section + ":" + perSection[section];
    box.disabled = false;
    try { box.checked = localStorage.getItem(key) === "1" || box.checked; } catch (e) {}
    box.addEventListener("change", function () {
      try { localStorage.setItem(key, box.checked ? "1" : "0"); } catch (e) {}
    });
  });

  content.querySelectorAll('a[href^="http"]').forEach(function (a) {
    a.target = "_blank";
    a.rel = "noopener noreferrer";
  });

  var diagrams = [];
  content.querySelectorAll("pre > code.language-mermaid").forEach(function (code) {
    var div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent;
    code.parentElement.replaceWith(div);
    diagrams.push(div);
  });

  function copy(text, button) {
    function done() {
      button.textContent = "Copied";
      setTimeout(function () { button.textContent = "Copy"; }, 1200);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done);
      return;
    }
    var area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    done();
  }
  content.querySelectorAll("pre").forEach(function (pre) {
    var code = pre.querySelector("code");
    if (!code) return;
    var button = document.createElement("button");
    button.type = "button";
    button.className = "btn copy";
    button.textContent = "Copy";
    button.addEventListener("click", function () { copy(code.textContent, button); });
    pre.appendChild(button);
  });

  // The drawer, below 860px. The rest of the page is inert while it is open.
  var sidebar = document.getElementById("sidebar");
  var menu = document.getElementById("menu");
  var bar = document.querySelector(".bar");
  var narrow = window.matchMedia("(max-width: 860px)");

  function drawer(open, refocus) {
    root.classList.toggle("toc-open", open);
    menu.setAttribute("aria-expanded", String(open));
    content.inert = open;
    bar.inert = open;
    if (open) {
      var here = current >= 0 ? visibleEntry(entries[current]).link : null;
      if (here) reveal(here);
      (here || sidebar).focus({ preventScroll: true });
    } else if (refocus) {
      menu.focus({ preventScroll: true });
    }
  }
  menu.addEventListener("click", function () { drawer(true); });
  document.getElementById("close").addEventListener("click", function () { drawer(false, true); });
  document.getElementById("scrim").addEventListener("click", function () { drawer(false, true); });
  document.getElementById("doc-title").addEventListener("click", function () {
    if (root.classList.contains("toc-open")) drawer(false, false);
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && root.classList.contains("toc-open")) drawer(false, true);
  });
  narrow.addEventListener("change", function () {
    if (!narrow.matches && root.classList.contains("toc-open")) drawer(false, false);
  });

  // Where the reader is. Collapsed groups are left alone while reading; the highlight
  // moves up to the nearest entry still shown.
  var here = document.getElementById("here");
  var current = -1;
  var highlighted = null;

  function visibleEntry(entry) {
    var shown = entry;
    for (var up = entry.parent; up; up = up.parent) if (up.list.hidden) shown = up;
    return shown;
  }
  function reveal(link) {
    var box = sidebar.getBoundingClientRect();
    var at = link.getBoundingClientRect();
    if (at.top < box.top + 96) sidebar.scrollTop += at.top - box.top - 96;
    else if (at.bottom > box.bottom - 48) sidebar.scrollTop += at.bottom - box.bottom + 48;
  }
  function mark(force) {
    var offset = bar.getBoundingClientRect().height + 24;
    var index = -1;
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].getBoundingClientRect().top < offset) index = i;
      else break;
    }
    if (index === current && !force) return;
    current = index;
    if (highlighted) {
      highlighted.classList.remove("current", "within");
      highlighted.removeAttribute("aria-current");
      highlighted = null;
    }
    if (index < 0) {
      here.textContent = "";
      return;
    }
    var entry = entries[index];
    var shown = visibleEntry(entry);
    highlighted = shown.link;
    if (shown === entry) {
      highlighted.classList.add("current");
      highlighted.setAttribute("aria-current", "location");
    } else {
      highlighted.classList.add("within");
    }
    here.textContent = entry.link.textContent;
    if (!narrow.matches || root.classList.contains("toc-open")) reveal(highlighted);
  }
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(function () { ticking = false; mark(false); });
    }
  }, { passive: true });

  function jumpToHash() {
    var id = location.hash && decodeURIComponent(location.hash.slice(1));
    var target = id && document.getElementById(id);
    if (!target) return;
    if (byId[id]) expandTo(byId[id]);
    for (var d = target.closest("details"); d; d = d.parentElement.closest("details")) d.open = true;
    target.scrollIntoView();
    mark(true);
  }
  window.addEventListener("hashchange", jumpToHash);

  // A diagram scaled to fit a phone is too small to read. When it would shrink by more
  // than a quarter, draw it at its own width and let its box scroll sideways, starting
  // from the middle, where a flowchart's first node usually is.
  function fitDiagrams() {
    diagrams.forEach(function (div) {
      var svg = div.querySelector("svg");
      if (!svg) return;
      if (!svg.dataset.natural) {
        var viewBox = svg.viewBox && svg.viewBox.baseVal;
        svg.dataset.natural = parseFloat(svg.style.maxWidth) || (viewBox && viewBox.width) || 0;
      }
      var natural = Number(svg.dataset.natural);
      var room = div.clientWidth - 24;
      var scroll = natural > 0 && room < natural * 0.75;
      var wasScrolling = svg.style.maxWidth === "none";
      svg.style.maxWidth = scroll ? "none" : natural + "px";
      svg.style.width = scroll ? natural + "px" : "";
      if (scroll && !wasScrolling) div.scrollLeft = (div.scrollWidth - div.clientWidth) / 2;
    });
  }
  var resizing = false;
  window.addEventListener("resize", function () {
    if (!resizing) {
      resizing = true;
      requestAnimationFrame(function () { resizing = false; fitDiagrams(); mark(true); });
    }
  });

  mark(true);
  if (window.mermaid && diagrams.length) {
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "default" });
    mermaid.run({ nodes: diagrams, suppressErrors: true }).finally(function () {
      fitDiagrams();
      jumpToHash();
    });
  } else {
    jumpToHash();
  }
})();
</script>
</body>
</html>
