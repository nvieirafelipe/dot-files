# Reload configs.
#
# R re-reads this file only. A full source runs tpm, and tpm re-initialises
# every plugin -- which on this machine takes over two minutes and holds the
# client the whole time, because each plugin is a shell script making dozens of
# tmux calls and one of them shells out to python. Plugins are already loaded in
# a running server, and their bindings and settings live in the server rather
# than in this file, so re-reading it without them picks up everything that
# actually changed here.
#
# The exception is a plugin's own @options: nova builds the status bar from them
# when it loads, so a change to one of those needs the full reload on M-R, or
# prefix+I, which is what tpm's own install binding does.
bind R source-file ~/.tmux.conf\; \
  display-message ".tmux.conf reloaded (plugins untouched -- M-R for those)"
bind M-R set -gu @tpm_loaded\; source-file ~/.tmux.conf\; \
  display-message "reloading with plugins, this takes a while ..."

# Handles apps that use alternate screen buffer
set -g alternate-screen on

# Fucking escape delay
set -sg escape-time 0
set-option -g focus-events on

# vi mode
set-window-option -g mode-keys vi

set-option -g status-position top

set -g base-index 1
setw -g pane-base-index 1

# Sort sessions by name
bind s choose-tree -sZ -O name

# Select window
bind -n C-PageUp previous-window
bind -n C-PageDown next-window
bind -n S-Left previous-window
bind -n S-Right next-window

# Select pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Kill pane
bind X kill-pane

# Review
# prefix+g and prefix+G, and the copy-mode keys that read a review, are bound by
# tmux-review/review.tmux -- loaded at the bottom of this file, after tpm.

# Customization
set -g default-terminal "tmux-256color"
# tmux-256color's terminfo has no RGB capability, so 24-bit colour has to be
# declared for the outer terminal here or every hex colour is quantised to 256.
# -s not -as: appending re-adds the entry on every reload (it had accumulated
# 18 copies of *:RGB by this point). Setting the whole value is idempotent.
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,*:RGB'

set -g status-interval 10

# Nova pads its segments, so leave room rather than truncating them
set -g status-left-length 100
set -g status-right-length 100

# The powerline separators already divide the windows, so no extra one
set -g window-status-separator ""

# Bold on top of nova's active-window colours
set -gw window-status-current-style bold

# Claude Code installs each release as ~/.local/share/claude/versions/<version>
# and symlinks `claude` at it, so the executable's basename -- and therefore
# pane_current_command -- is the version number. Show the harness name instead.
set -g automatic-rename-format '#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}'

# Bicycle bell (CC0, Wikimedia Commons) converted to ~/Library/Sounds.
# 'waiting' keeps a distinct sound so the two are tellable apart unheard.
set -g @agent-notify-sound-done 'BicycleBell'
set -g @agent-notify-sound-waiting 'Ping'

# Agent status tracking. The window label says what an agent in that window is
# doing. Everything that writes it lives in the tmux-agent-status plugin, whose
# entry point is loaded at the bottom of this file; the only part that belongs
# here is where the label goes, which is the nova window format below.

# Enable mouse control
set -g mouse on

# Plugins

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir '.tmux/resurrect'

set -g @plugin 'tmux-plugins/tmux-yank'
# Copy to system clipboard on mouse drag-select too (default is primary)
set -g @yank_selection_mouse 'clipboard'
# Stay in copy-mode after yanking instead of tmux-yank's default
# copy-pipe-and-cancel. The review diff is read in copy-mode -- its jump keys
# are guarded on the mode and the sidebar follows the reader through
# copy_cursor_y -- so cancelling on yank ended the review, and re-entering
# afterwards could only ever approximate the scroll position it threw away.
# This is tmux-yank's own option, applied when it binds the keys, so it cannot
# lose a race with the plugin the way an overriding bind-key can. It covers y,
# ! and the mouse drag; the keys tmux-yank hardcodes are handled below.
# Note it applies everywhere, not only in a review: yanking now leaves you in
# copy-mode in any pane, which is one line to revert if that grates.
set -g @yank_action 'copy-pipe'

set -g @plugin 'tmux-plugins/tmux-open'
# copy-mode `S` searches the selection on Google
set -g @open-S 'https://www.google.com/search?q='

set -g @plugin 'alexwforsythe/tmux-which-key'
# The plugin regenerates its menu by shelling out to build.py every time it
# loads, and python3 here is an asdf shim -- 1.4s before tmux can finish
# starting, for a file that only changes when the yaml does. Rebuilt on demand
# instead: tmux/rebuild-which-key.sh, which the README points at.
set -g @tmux-which-key-disable-autobuild 1
# Menu lives in tmux/which-key.yaml, symlinked to the plugin's config.yaml --
# a link into the checkout because that is the only place the plugin reads a
# config from. It gitignores the name so an update cannot clobber it, and has
# no option that points elsewhere. The one alternative its README offers,
# @tmux-which-key-xdg-enable, would keep the config under ~/.config, but
# plugin.sh.tmux resolves those paths with `realpath --relative-to` -- GNU
# only. The macOS realpath answers "illegal option -- -", and the script runs
# under set -e, so the plugin would not load at all.
#
# What tmux sources is the generated plugin/init.tmux; with autobuild off,
# tmux/rebuild-which-key.sh is what regenerates it from the yaml.

set -g @plugin 'o0th/tmux-nova'
# Nova owns status-style, status-left, status-right, window-status-*-format,
# status-justify, message-style, mode-style and both pane border styles.
#
# Tokyo Night (storm), from tokyonight.nvim's storm.lua -- the same variant
# Ghostty and iTerm2 use, so the bar sits flush against the terminal:
#   bg #24283b   bg_highlight #292e42   fg_gutter #3b4261
#   fg #c0caf5   comment #565f89
#   blue #7aa2f7   magenta #bb9af7   yellow #e0af68
#
# Separators match lualine's defaults (nvim/lua/plugins/ui.lua sets none, so
# it uses section separators U+E0B0 / U+E0B2).

set -g @nova-nerdfonts true
set -g @nova-nerdfonts-left ''
set -g @nova-nerdfonts-right ''
set -g @nova-padding 1
set -g @nova-pane-justify 'left'

# Window label: index, copy/search mode when active, name, then the agent
# status glyph when one is running in that window
# A review window's diff pane is always in copy-mode -- that is how it is
# read -- so the mode is not news there and only costs the tab width.
set -g @nova-pane '#I#{?@review,,#{?pane_in_mode,  #{pane_mode},}}  #W#{?@agent_state, #{?window_active,#{@agent_status_active},#{@agent_status}},}'

set -g @nova-status-style-bg '#24283b'
set -g @nova-status-style-fg '#565f89'
# blue0 from tokyonight storm. A light active background (the earlier
# magenta) forces every glyph on it dark, which turns orange into maroon --
# a dark accent lets each state keep its real colour.
set -g @nova-status-style-active-bg '#3d59a1'
set -g @nova-status-style-active-fg '#c0caf5'
set -g @nova-status-activity-fg '#e0af68'

set -g @nova-message-style-bg '#292e42'
set -g @nova-message-style-fg '#c0caf5'
set -g @nova-message-command-style-bg '#292e42'
set -g @nova-message-command-style-fg '#c0caf5'
set -g @nova-mode-style-bg '#7aa2f7'
set -g @nova-mode-style-fg '#24283b'

set -g @nova-pane-border-style '#3b4261'
set -g @nova-pane-active-border-style '#7aa2f7'

# Segment colours are '<bg> <fg>' -- background first. A dark block with a
# colour-coded icon and light text mirrors lualine's own devicon section, and
# lets the language colour from repo-icon.sh come through.
set -g @nova-segment-session '#(~/.tmux/scripts/repo-icon.sh "#{pane_current_path}" c0caf5) #S'
set -g @nova-segment-session-colors '#3b4261 #c0caf5'

set -g @nova-segments-0-left ''
set -g @nova-segments-0-right 'session'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
#
# Once per server, not once per source: see the note on the R binding above.
# The flag is a server option, so it is gone when the server is, and M-R clears
# it to force the slow path.
if -F '#{!=:#{@tpm_loaded},1}' {
  run '/opt/homebrew/opt/tpm/share/tpm/tpm'
  set -g @tpm_loaded 1
}

# The review plugin: prefix+g for a commit list beside the diff, prefix+G for
# the working tree. Every binding it owns lives in its own entry point.
#
# After tpm on purpose: the copy-mode-vi table is rewritten as the plugins load,
# and the plugin binds Enter there -- set before tpm, that is overwritten. It is
# not installed through tpm itself because it is part of this repo; install.sh
# links it into ~/.tmux/plugins beside the ones that are.
run '~/.tmux/plugins/tmux-review/review.tmux'

# The agent status plugin: the tmux hooks that clear an acknowledged glyph and
# re-derive a drifted one. Its own entry point, for the same reason -- and like
# the review plugin it is part of this repo, so install.sh links it in beside
# the plugins tpm fetches rather than tpm fetching it.
run '~/.tmux/plugins/tmux-agent-status/agent-status.tmux'

bind Enter split-window -h \; send-keys "tt" Enter

set -g default-shell ${SHELL}
# This is only needed in OS X
# set -g default-command "reattach-to-user-namespace -l ${SHELL}"

set -g history-limit 50000
